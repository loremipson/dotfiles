# Workflow-aware workmux menu.
# Set @workflow to "graphite" in a project-local .tmux.conf.local to switch modes.
# The default remains generic Git/workmux.

set -g @workflow "git"

bind w if-shell -F '#{==:#{@workflow},graphite}' \
  'display-menu -x C -y C -T "workmux / graphite" \
    "new from trunk" a "popup -d '\''#{pane_current_path}'\'' -w 80% -h 20% -x C -y C -E '\''~/.config/tmux/workmux/graphite/new.sh'\''" \
    "stack on current" t "popup -d '\''#{pane_current_path}'\'' -w 80% -h 20% -x C -y C -E '\''~/.config/tmux/workmux/graphite/stack.sh'\''" \
    "review branch" b "popup -d '\''#{pane_current_path}'\'' -w 80% -h 60% -x C -y C -E '\''~/.config/tmux/workmux/graphite/review.sh'\''" \
    "open" o "popup -d '\''#{pane_current_path}'\'' -w 80% -h 60% -x C -y C -E '\''~/.config/tmux/workmux/git/fzf.sh open'\''" \
    "discard" r "popup -d '\''#{pane_current_path}'\'' -w 80% -h 60% -x C -y C -E '\''~/.config/tmux/workmux/graphite/discard.sh'\''" \
    "close" c "popup -d '\''#{pane_current_path}'\'' -w 80% -h 60% -x C -y C -E '\''~/.config/tmux/workmux/git/fzf.sh close'\''" \
    "dashboard" d "popup -d '\''#{pane_current_path}'\'' -w 90% -h 90% -x C -y C -E '\''workmux dashboard'\''" \
    "graphite log" l "popup -d '\''#{pane_current_path}'\'' -w 90% -h 90% -x C -y C -E '\''~/.config/tmux/workmux/graphite/log.sh'\''" \
    "sidebar" s "run-shell '\''workmux sidebar'\''" \
    "quit" q ""' \
  'display-menu -x C -y C -T "workmux" \
    "add" a "popup -d '\''#{pane_current_path}'\'' -w 80% -h 20% -x C -y C -E '\''~/.config/tmux/workmux/git/add-branch-name.sh'\''" \
    "add w/branch" b "popup -d '\''#{pane_current_path}'\'' -w 25% -h 80% -x C -y C -E '\''~/.config/tmux/workmux/git/add-branch.sh'\''" \
    "add w/prompt" p "popup -d '\''#{pane_current_path}'\'' -w 80% -h 20% -x C -y C -E '\''~/.config/tmux/workmux/git/add-prompt.sh'\''" \
    "open" o "popup -d '\''#{pane_current_path}'\'' -w 80% -h 60% -x C -y C -E '\''~/.config/tmux/workmux/git/fzf.sh open'\''" \
    "remove" r "popup -d '\''#{pane_current_path}'\'' -w 80% -h 60% -x C -y C -E '\''~/.config/tmux/workmux/git/fzf.sh remove'\''" \
    "close" c "popup -d '\''#{pane_current_path}'\'' -w 80% -h 60% -x C -y C -E '\''~/.config/tmux/workmux/git/fzf.sh close'\''" \
    "dashboard" d "popup -d '\''#{pane_current_path}'\'' -w 90% -h 90% -x C -y C -E '\''workmux dashboard'\''" \
    "sidebar" s "run-shell '\''workmux sidebar'\''" \
    "quit" q ""'
