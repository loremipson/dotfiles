gui:
  nerdFontsVersion: "3"

  theme:
    activeBorderColor:
      - blue
      - bold

    inactiveBorderColor:
      - default

    searchingActiveBorderColor:
      - yellow
      - bold

    optionsTextColor:
      - blue

    # Uses the terminal's current fg/bg, so it works in both Ink and Pearl.
    selectedLineBgColor:
      - reverse

    inactiveViewSelectedLineBgColor:
      - bold

    cherryPickedCommitFgColor:
      - magenta

    cherryPickedCommitBgColor:
      - cyan

    markedBaseCommitFgColor:
      - yellow

    markedBaseCommitBgColor:
      - yellow

    unstagedChangesColor:
      - red

    defaultFgColor:
      - default

git:
  diffRenderers:
    - name: delta
      command: delta-kanso --paging=never
      colorArg: always
